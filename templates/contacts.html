<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="/" class="logo">Cloud<span>App</span></a>
        <ul class="nav-links">
            <li><a href="/" class="active">Главная</a></li>
            <li><a href="/about.html">О сайте</a></li>
            <li><a href="/contacts.html">Контакты</a></li>
            <li><a href="/author.html">Об авторе</a></li>
            <li><a href="/add">Добавить товар</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Свяжитесь с нами</h1>
        <p>Остались вопросы или есть предложения? Напишите нам сообщение.</p>
    </section>

    <form class="contact-form" action="contacts.html" method="get">
        <div class="form-group">
            <label for="name">Ваше имя</label>
            <input type="text" id="name" name="name" placeholder="Иван Иванов" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>
        <div class="form-group">
            <label for="message">Сообщение</label>
            <textarea id="message" name="message" rows="5" placeholder="Введите ваше сообщение..." required></textarea>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Отправить</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 HubApp. Все права защищены.</p>
</footer>

</body>
</html>
